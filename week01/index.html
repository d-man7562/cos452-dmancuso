<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 1 Starter -- Canvas &amp; Clear Color</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    #overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10; /* Ensures it sits in front of the canvas */
      color: #ffffff;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 24px;
      pointer-events: none;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <div id="overlay">Hello World muthafucka

  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");

    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * dpr);
      const height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function render() {
      resizeCanvasToDisplaySize();
      gl.viewport(0, 0, canvas.width, canvas.height);

  
     const t = Date.now() / 1000;
        gl.clearColor(
        0.5 + 0.5 * Math.sin(t),  // r
        0.5 + 0.5 * Math.cos(t),  // g
        0.5,                       // b
        1.0                        // a
        );
      gl.clear(gl.COLOR_BUFFER_BIT);
       requestAnimationFrame(render);
    }

    window.addEventListener("resize", render);
    
    requestAnimationFrame(render);
  </script>
</body>
</html>
