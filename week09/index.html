<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 9 Starter -- Textures</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    const vertexSource = `#version 300 es
      in vec2 a_position;
      in vec2 a_uv;
      out vec2 v_uv;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
        v_uv = a_uv;
      }`;

    const fragmentSource = `#version 300 es
      precision mediump float;
      in vec2 v_uv;
      uniform sampler2D u_texture;
      out vec4 outColor;
      void main() { outColor = texture(u_texture, v_uv); }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error("Shader failed to compile: " + gl.getShaderInfoLog(shader));
      }
      return shader;
    }
    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }

    const program = createProgram(gl, vertexSource, fragmentSource);

    // interleaved: x, y, u, v
    // TODO(student) (c): change every 1 in the UVs (the u, v columns) to 2 so the
    // UVs run past 1.0; otherwise REPEAT and CLAMP_TO_EDGE look the same.
    const data = new Float32Array([
      -0.7,-0.7, 0,0,   0.7,-0.7, 1,0,   0.7,0.7, 1,1,
      -0.7,-0.7, 0,0,   0.7, 0.7, 1,1,  -0.7,0.7, 0,1,
    ]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const F = Float32Array.BYTES_PER_ELEMENT, stride = 4 * F;
    const aPosition = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, stride, 0);
    const aUV = gl.getAttribLocation(program, "a_uv");
    gl.enableVertexAttribArray(aUV);
    gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, stride, 2 * F);
    const uTexture = gl.getUniformLocation(program, "u_texture");

    const texture = gl.createTexture();
    const image = new Image();
    image.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, texture);
      // TODO(student) (b): While the origin point of a HTML image is the top-left corner,
      //  the origin point of a WebGL texture is the bottom-left corner. This means that
      //  when you map the image onto a texture, it appears upside down unless you flip it vertically. 
      // The other fix would be to adjust the UV coordinates in the vertex data. UV coordinates are used to map
      // textures onto geometry. U stands for the horizontal axis and V stands for the vertical axis. 
      //  Both U and V use a normalized scale between 0-1. By flipping the V coordinate 
      //  using 1-v instead of v, you can flip the texture mapping starting point and the 
      // mapping will draw the image correctly. This UV coordinate solution is more efficient than 
      // using the pixelStorei() function because UV mapping is handled with a single 1-v operation
      // while pixelStorei() requires moving data about the image in memory. 
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
      //TODO(student) (c): REPEAT lets the texture repeat. If a UV coordinate goes beyond the 0-1 range, the texture will repeat.
      //  If you are making a game and want a brick wall for example, use REPEAT to allow the texture to repeat past the 0-1 UV range. 
      // CLAMP_TO_EDGE uses the last pixel of the image (at the edge) to fill the remaining UV coordinates. Visually, the edges look a lot 
      // cleaner when I used CLAMP_TO_EDGE.
      // NEAREST and LINEAR both involve reading the texture data to determine the color of a pixel.
      // NEAREST uses the nearest texel (texture pixel) relative to the UV coordinate to determine the color of a pixel.
      // LINEAR uses a weighted average of the four nearest texels to determine the color of a pixel.
      // The result of both options is this: NEAREST makes the image look more pixelated, with rougher edges.
      // LINEAR makes the image look smoother and with higher quality. 
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      render();
    };
    //TODO(student) (a): replaced black box with image of verity in Minecraft
    image.src = "verity.webp"; 

    function render() {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.useProgram(program);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(uTexture, 0);

      gl.clearColor(0.10, 0.12, 0.16, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    render(); // draws before the image loads; render() runs again on image.onload

    // TODO(student) (d): commit the image with index.html, open your Pages URL,
    // and check the console (F12). File names are case-sensitive on Pages.
  </script>
</body>
</html>
