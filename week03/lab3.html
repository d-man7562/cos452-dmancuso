<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 3 Starter -- Hello Triangle</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
  <meta charset="utf-8">
  <title>Week 4 Starter -- Attributes & Uniforms</title>
  <style>
    html, body { height: 100%; margin: 0;overflow: hidden; /* Stops scrollbars permanently */ }
    canvas { width: 100%; height: 100%; display: block; }
  .overlay-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: none; /* Prevents text from blocking canvas mouse clicks */
      margin: 0;
      text-align: center;      /* Keeps wrapped lines centered */
      width: 90%;
      box-sizing: border-box;

    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <h1 class="overlay-title">Clipping a point of the triangle beyond the boundary appears as if the triangle stretches beyond the webpage. The webpage retains the remainder of triangle that is within the webpage's boundaries. </h1>
    <canvas id="gl-canvas"></canvas>
  </div>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    const vertexSource = `#version 300 es
      in vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }`;

    const fragmentSource = `#version 300 es
      precision mediump float;
      out vec4 outColor;
      void main() {
        outColor = vec4(0.39, 0.5, 0.51, 1.0);  // TODO(student): recolor me
      }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error("Shader failed to compile: " + log);
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }

    const program = createProgram(gl, vertexSource, fragmentSource);

    // TODO(student): change these three vertices
    const positions = new Float32Array([
       .25,  -1.75,   // top
      -0.25, 0.5,   // bottom-left
       0.75, 0.5,   // bottom-right
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const aPosition = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

    function render() {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.useProgram(program);
      gl.clearColor(0.10, 0.12, 0.16, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
